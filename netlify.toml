[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST,SMTP_PORT,SALES_EMAIL,SMTP_USER,SUPABASE_SERVICE_ROLE_KEY"

[[redirects]]
