<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C15" />
      <stop offset="50%" stop-color="#0B1320" />
      <stop offset="100%" stop-color="#111B2C" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="72%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#070C15" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanBackdrop" cx="25%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#070C15" stop-opacity="0" />
    </radialGradient>

    <!-- Glass & Card Gradients -->
    <linearGradient id="browserGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A263B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F1726" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24344E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#152033" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.65" />
    </filter>
    <filter id="glowEmerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="rgba(52,211,153,0.15)" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#techGrid)" />
  <rect width="800" height="500" fill="url(#emeraldGlow)" />
  <rect width="800" height="500" fill="url(#cyanBackdrop)" />

  <!-- Ambient Light Streak -->
  <path d="M-50 120 L850 360" stroke="rgba(52,211,153,0.06)" stroke-width="2" stroke-dasharray="8 12" />

  <!-- MAIN BROWSER WINDOW MOCKUP -->
  <g filter="url(#shadowLg)">
    <!-- Window Body -->
    <rect x="70" y="55" width="660" height="390" rx="16" fill="url(#browserGlass)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
    
    <!-- Titlebar -->
    <rect x="70" y="55" width="660" height="42" rx="16" fill="#131C2C" />
    <path d="M70 97 h660" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="96" cy="76" r="5.5" fill="#EF4444" opacity="0.85" />
    <circle cx="114" cy="76" r="5.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="132" cy="76" r="5.5" fill="#10B981" opacity="0.85" />

    <!-- Browser URL Bar -->
    <rect x="160" y="65" width="280" height="22" rx="6" fill="#0B1320" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <circle cx="174" cy="76" r="3" fill="#34D399" />
    <text x="186" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">https://yourbusiness.com</text>

    <!-- Status Pill in Titlebar -->
    <rect x="625" y="65" width="85" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(52,211,153,0.3)" stroke-width="1" />
    <circle cx="637" cy="76" r="2.5" fill="#34D399" filter="url(#glowEmerald)" />
    <text x="645" y="80" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.05em">LIVE 100%</text>

    <!-- CONTENT AREA INSIDE BROWSER -->
    <!-- Nav Bar Inside Webpage -->
    <g transform="translate(100, 115)">
      <rect x="0" y="0" width="600" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" />
      <!-- Logo Mark -->
      <rect x="14" y="9" width="16" height="16" rx="4" fill="#34D399" />
      <rect x="36" y="14" width="60" height="6" rx="3" fill="#E2E8F0" />
      
      <!-- Nav Links -->
      <rect x="340" y="14" width="42" height="5" rx="2.5" fill="#64748B" />
      <rect x="396" y="14" width="42" height="5" rx="2.5" fill="#64748B" />
      <rect x="452" y="14" width="42" height="5" rx="2.5" fill="#64748B" />
      <!-- Quote CTA Button -->
      <rect x="510" y="7" width="76" height="20" rx="6" fill="url(#btnGrad)" />
      <text x="526" y="21" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="800">Get Quote</text>
    </g>

    <!-- Hero Content (Left Column) -->
    <g transform="translate(100, 170)">
      <!-- Eyebrow Tag -->
      <rect x="0" y="0" width="118" height="20" rx="5" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.25)" stroke-width="1" />
      <text x="10" y="14" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">FAST &amp; RESPONSIVE</text>

      <!-- Headline Bars -->
      <rect x="0" y="32" width="240" height="14" rx="4" fill="#FFFFFF" />
      <rect x="0" y="52" width="180" height="14" rx="4" fill="#E2E8F0" />
      
      <!-- Description Bars -->
      <rect x="0" y="78" width="260" height="6" rx="3" fill="#64748B" />
      <rect x="0" y="90" width="220" height="6" rx="3" fill="#64748B" />
      <rect x="0" y="102" width="190" height="6" rx="3" fill="#475569" />

      <!-- Action Buttons -->
      <rect x="0" y="126" width="105" height="30" rx="8" fill="url(#btnGrad)" />
      <text x="24" y="145" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Book Now</text>

      <rect x="115" y="126" width="90" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="135" y="145" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Services</text>

      <!-- Feature Badges Row -->
      <g transform="translate(0, 175)">
        <rect x="0" y="0" width="80" height="42" rx="8" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.06)" />
        <text x="10" y="17" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="800">5 Pages</text>
        <text x="10" y="32" fill="#64748B" font-family="'Inter', sans-serif" font-size="8" font-weight="600">Complete</text>

        <rect x="90" y="0" width="80" height="42" rx="8" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.06)" />
        <text x="100" y="17" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="800">SSL + CDN</text>
        <text x="100" y="32" fill="#64748B" font-family="'Inter', sans-serif" font-size="8" font-weight="600">Included</text>

        <rect x="180" y="0" width="80" height="42" rx="8" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.06)" />
        <text x="190" y="17" fill="#FBBF24" font-family="'Inter', sans-serif" font-size="11" font-weight="800">Forms</text>
        <text x="190" y="32" fill="#64748B" font-family="'Inter', sans-serif" font-size="8" font-weight="600">Lead Ready</text>
      </g>
    </g>

    <!-- RIGHT HERO VISUAL: 100/100 SPEED GAUGE & DEVICE MOCKUP CARD -->
    <g transform="translate(420, 160)" filter="url(#badgeShadow)">
      <!-- Main Metric Glass Card -->
      <rect x="0" y="0" width="280" height="255" rx="16" fill="url(#cardGlass)" stroke="url(#emeraldBorder)" stroke-width="1.5" />
      
      <!-- Card Header -->
      <text x="24" y="34" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.12em">GOOGLE PAGESPEED</text>
      
      <!-- SPEED CIRCLE GAUGE -->
      <g transform="translate(140, 120)">
        <!-- Outer Glow Ring -->
        <circle cx="0" cy="0" r="62" fill="none" stroke="rgba(52,211,153,0.1)" stroke-width="12" />
        <!-- Background Track -->
        <circle cx="0" cy="0" r="54" fill="#0B1320" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
        <!-- Progress Active Arc (100% full circle) -->
        <circle cx="0" cy="0" r="54" fill="none" stroke="url(#gaugeGrad)" stroke-width="8.5" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0" filter="url(#glowEmerald)" />
        
        <!-- Inner Glow -->
        <circle cx="0" cy="0" r="44" fill="#0D192B" />

        <!-- Score Number -->
        <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.03em">100</text>
        <text x="0" y="24" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">OPTIMAL</text>
      </g>

      <!-- Metric Pills Below Gauge -->
      <g transform="translate(24, 202)">
        <rect x="0" y="0" width="70" height="34" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
        <text x="12" y="15" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="800">0.4s</text>
        <text x="12" y="27" fill="#64748B" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600">LCP LOAD</text>

        <rect x="80" y="0" width="70" height="34" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
        <text x="92" y="15" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="800">100%</text>
        <text x="92" y="27" fill="#64748B" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600">MOBILE</text>

        <rect x="160" y="0" width="72" height="34" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
        <text x="172" y="15" fill="#A78BFA" font-family="'Inter', sans-serif" font-size="11" font-weight="800">A+ SEC</text>
        <text x="172" y="27" fill="#64748B" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600">SSL AUDIT</text>
      </g>
    </g>
  </g>

  <!-- FLOATING ULTRA-FAST LIGHTNING BADGE -->
  <g transform="translate(48, 360)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="165" height="46" rx="23" fill="#0E1A2E" stroke="rgba(52,211,153,0.4)" stroke-width="1.4" />
    <circle cx="24" cy="23" r="14" fill="rgba(16,185,129,0.2)" />
    <!-- Lightning Icon -->
    <path d="M26 14 L20 23 L24 23 L22 32 L28 22 L24 22 Z" fill="#34D399" filter="url(#glowEmerald)" />
    <text x="46" y="21" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800">Ultra Fast Site</text>
    <text x="46" y="34" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">SUB-SECOND READY</text>
  </g>
</svg>
