<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgMkt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1B" />
      <stop offset="50%" stop-color="#0B172E" />
      <stop offset="100%" stop-color="#112447" />
    </linearGradient>
    <radialGradient id="surgeGlow" cx="70%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#2469EB" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#050C1B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldBackdrop" cx="22%" cy="80%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#050C1B" stop-opacity="0" />
    </radialGradient>

    <!-- Glass & Border -->
    <linearGradient id="growthGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182744" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0E192D" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="growthBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowMkt2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.75" />
    </filter>
    <filter id="glowSurge" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="growthGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.2" fill="rgba(96,165,250,0.2)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgMkt2)" />
  <rect width="800" height="500" fill="url(#growthGrid)" />
  <rect width="800" height="500" fill="url(#surgeGlow)" />
  <rect width="800" height="500" fill="url(#emeraldBackdrop)" />

  <!-- MAIN SEO & GROWTH MARKETING SHELL -->
  <g filter="url(#shadowMkt2)">
    <rect x="65" y="50" width="670" height="400" rx="18" fill="url(#growthGlass)" stroke="url(#growthBorder)" stroke-width="1.6" />

    <!-- Top Bar -->
    <rect x="65" y="50" width="670" height="46" rx="18" fill="#101C32" />
    <path d="M65 96 h670" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Control dots -->
    <circle cx="94" cy="73" r="5.5" fill="#EF4444" opacity="0.85" />
    <circle cx="112" cy="73" r="5.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="130" cy="73" r="5.5" fill="#10B981" opacity="0.85" />

    <!-- Title Header -->
    <rect x="160" y="61" width="310" height="24" rx="7" fill="#091322" stroke="rgba(96,165,250,0.25)" stroke-width="1" />
    <circle cx="176" cy="73" r="3.5" fill="#60A5FA" filter="url(#glowSurge)" />
    <text x="188" y="77" fill="#DBEAFE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ADVANCED SEO &amp; ROI SURGE CAMPAIGN</text>

    <!-- Top Tag -->
    <rect x="600" y="61" width="112" height="24" rx="12" fill="rgba(16,185,129,0.2)" stroke="rgba(52,211,153,0.5)" stroke-width="1.2" />
    <circle cx="614" cy="73" r="3" fill="#34D399" filter="url(#glowSurge)" />
    <text x="624" y="77" fill="#D1FAE5" font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="0.05em">SURGE +340%</text>

    <!-- LEFT COLUMN: HIGH-TRAJECTORY ROI SURGE GRAPH -->
    <g transform="translate(95, 115)">
      <rect x="0" y="0" width="330" height="310" rx="14" fill="#0A1426" stroke="rgba(255,255,255,0.07)" stroke-width="1" />

      <!-- Section Title & Metric -->
      <g transform="translate(20, 24)">
        <text x="0" y="0" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.1em">ORGANIC SEARCH TRAFFIC &amp; LEADS</text>
        <text x="0" y="24" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="22" font-weight="900">+340% Surge</text>
        <rect x="175" y="6" width="95" height="22" rx="11" fill="rgba(16,185,129,0.18)" stroke="rgba(52,211,153,0.4)" stroke-width="1" />
        <text x="185" y="21" fill="#34D399" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800">↗ EXPONENTIAL</text>
      </g>

      <!-- Surge Chart Matrix -->
      <g transform="translate(20, 68)">
        <!-- Grid Lines -->
        <path d="M0 30 L290 30 M0 70 L290 70 M0 110 L290 110 M0 150 L290 150" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

        <!-- Area Glow Fill -->
        <path d="M0 140 Q60 135 110 115 T190 70 T280 18 L280 150 L0 150 Z" fill="url(#areaGrad)" />
        
        <!-- Vibrant Trajectory Curve Line -->
        <path d="M0 140 Q60 135 110 115 T190 70 T280 18" fill="none" stroke="url(#curveGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowSurge)" />

        <!-- Milestone Dot 1 -->
        <circle cx="110" cy="115" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8" />
        <!-- Milestone Dot 2 -->
        <circle cx="190" cy="70" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
        <!-- Peak Target Dot 3 -->
        <circle cx="280" cy="18" r="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2" filter="url(#glowSurge)" />

        <!-- Floating Tooltip on Peak -->
        <g transform="translate(195, -12)">
          <rect x="0" y="0" width="80" height="24" rx="6" fill="#10B981" />
          <text x="40" y="16" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="900">#1 Top Rank</text>
        </g>
      </g>

      <!-- Growth Timeline Labels -->
      <g transform="translate(20, 230)">
        <text x="0" y="0" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">MONTH 1</text>
        <text x="85" y="0" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">MONTH 2</text>
        <text x="175" y="0" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">MONTH 3</text>
        <text x="250" y="0" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">TARGET #1</text>
      </g>

      <!-- Bottom Status -->
      <g transform="translate(20, 268)">
        <rect x="0" y="0" width="290" height="28" rx="6" fill="rgba(36,105,235,0.15)" />
        <text x="145" y="18" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">COMPETITOR AUDIT &amp; KEYWORD TAKEOVER</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: TARGET KEYWORD DOMINANCE CARDS -->
    <g transform="translate(445, 115)">
      <rect x="0" y="0" width="260" height="310" rx="14" fill="#0A1426" stroke="rgba(96,165,250,0.25)" stroke-width="1.2" />

      <text x="20" y="28" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Target Keyword Positions</text>
      <text x="20" y="42" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">ORGANIC GOOGLE SEARCH</text>

      <!-- Keyword Items Matrix -->
      <g transform="translate(18, 54)">
        <!-- Keyword 1 -->
        <rect x="0" y="0" width="224" height="42" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(52,211,153,0.3)" stroke-width="1" />
        <rect x="8" y="10" width="24" height="22" rx="5" fill="#10B981" />
        <text x="20" y="25" text-anchor="middle" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="900">#1</text>
        <text x="38" y="20" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Commercial Term #1</text>
        <text x="38" y="32" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="7.5">HIGH BUYER INTENT</text>
        <text x="214" y="26" text-anchor="end" fill="#34D399" font-family="'Inter', sans-serif" font-size="10" font-weight="800">▲ +12</text>

        <!-- Keyword 2 -->
        <rect x="0" y="48" width="224" height="42" rx="8" fill="rgba(36,105,235,0.15)" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
        <rect x="8" y="58" width="24" height="22" rx="5" fill="#2563EB" />
        <text x="20" y="73" text-anchor="middle" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="900">#1</text>
        <text x="38" y="68" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Local City Leader</text>
        <text x="38" y="80" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="7.5">PRIMARY SERVICE</text>
        <text x="214" y="74" text-anchor="end" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="10" font-weight="800">▲ +18</text>

        <!-- Keyword 3 -->
        <rect x="0" y="96" width="224" height="42" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
        <rect x="8" y="106" width="24" height="22" rx="5" fill="#6366F1" />
        <text x="20" y="121" text-anchor="middle" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="900">#2</text>
        <text x="38" y="116" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Near Me Services</text>
        <text x="38" y="128" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="7.5">INBOUND CALLS</text>
        <text x="214" y="122" text-anchor="end" fill="#818CF8" font-family="'Inter', sans-serif" font-size="10" font-weight="800">▲ +8</text>

        <!-- Keyword 4 -->
        <rect x="0" y="144" width="224" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
        <circle cx="20" cy="164" r="4" fill="#34D399" />
        <text x="32" y="168" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">Authority Content &amp; Backlinks</text>
      </g>

      <!-- Direct Action Button -->
      <g transform="translate(18, 248)">
        <rect x="0" y="0" width="224" height="42" rx="10" fill="#2563EB" />
        <text x="112" y="26" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800">Accelerate SEO Growth</text>
      </g>
    </g>
  </g>

  <!-- FLOATING MOST POPULAR CALLOUT BADGE -->
  <g transform="translate(48, 385)" filter="url(#shadowMkt2)">
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#0C172E" stroke="#34D399" stroke-width="1.4" />
    <circle cx="24" cy="23" r="14" fill="rgba(16,185,129,0.25)" />
    <!-- Growth Arrow Icon -->
    <path d="M18 28 L23 23 L26 26 L30 18 M30 18 L25 18 M30 18 L30 23" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSurge)" />
    <text x="46" y="21" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800">Top Growth ROI</text>
    <text x="46" y="34" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">+340% TRAFFIC SURGE</text>
  </g>
</svg>
