<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgMkt3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#1C1F32" />
    </linearGradient>
    <radialGradient id="amberGlow3" cx="70%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueBackdrop3" cx="22%" cy="80%" r="42%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>

    <!-- Glass & Border -->
    <linearGradient id="leadGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1E2D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10121D" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="leadBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="goldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowMkt3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.75" />
    </filter>
    <filter id="glowGold3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="leadGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.2" fill="rgba(245,158,11,0.2)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgMkt3)" />
  <rect width="800" height="500" fill="url(#leadGrid)" />
  <rect width="800" height="500" fill="url(#amberGlow3)" />
  <rect width="800" height="500" fill="url(#blueBackdrop3)" />

  <!-- MAIN MARKET LEADER DOMINANCE SHELL -->
  <g filter="url(#shadowMkt3)">
    <rect x="65" y="50" width="670" height="400" rx="18" fill="url(#leadGlass)" stroke="url(#leadBorder)" stroke-width="1.6" />

    <!-- Top Bar -->
    <rect x="65" y="50" width="670" height="46" rx="18" fill="#141624" />
    <path d="M65 96 h670" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Control dots -->
    <circle cx="94" cy="73" r="5.5" fill="#EF4444" opacity="0.85" />
    <circle cx="112" cy="73" r="5.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="130" cy="73" r="5.5" fill="#10B981" opacity="0.85" />

    <!-- Title Header -->
    <rect x="160" y="61" width="310" height="24" rx="7" fill="#0C0E1A" stroke="rgba(245,158,11,0.25)" stroke-width="1" />
    <circle cx="176" cy="73" r="3.5" fill="#F59E0B" filter="url(#glowGold3)" />
    <text x="188" y="77" fill="#FEF3C7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">APEX MARKET DOMINANCE &amp; OMNICHANNEL</text>

    <!-- Top Tag -->
    <rect x="595" y="61" width="118" height="24" rx="12" fill="rgba(245,158,11,0.2)" stroke="rgba(251,191,36,0.5)" stroke-width="1.2" />
    <circle cx="609" cy="73" r="3" fill="#FBBF24" filter="url(#glowGold3)" />
    <text x="619" y="77" fill="#FFFBEB" font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="0.05em">78% MARKET SHARE</text>

    <!-- LEFT COLUMN: OMNICHANNEL NETWORK CONSTELLATION -->
    <g transform="translate(95, 115)">
      <rect x="0" y="0" width="330" height="310" rx="14" fill="#0E101D" stroke="rgba(255,255,255,0.07)" stroke-width="1" />

      <text x="20" y="28" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.1em">OMNICHANNEL DOMINANCE MATRIX</text>

      <!-- Network Node Cluster -->
      <g transform="translate(20, 48)">
        <!-- Center Core: Your Business -->
        <rect x="90" y="55" width="110" height="50" rx="10" fill="url(#goldShield)" filter="url(#glowGold3)" />
        <text x="145" y="78" text-anchor="middle" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="900">YOUR BRAND</text>
        <text x="145" y="94" text-anchor="middle" fill="#FEF3C7" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">#1 MARKET LEADER</text>

        <!-- Node 1 (Top Left): Local Maps Pack -->
        <rect x="0" y="0" width="85" height="36" rx="7" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
        <text x="42" y="16" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="9" font-weight="800">Google Maps</text>
        <text x="42" y="28" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="7">#1 IN PACK</text>
        <path d="M75 36 L100 55" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3" />

        <!-- Node 2 (Top Right): Organic Google SEO -->
        <rect x="205" y="0" width="85" height="36" rx="7" fill="rgba(16,185,129,0.12)" stroke="rgba(52,211,153,0.3)" stroke-width="1" />
        <text x="247" y="16" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="9" font-weight="800">Organic SEO</text>
        <text x="247" y="28" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="7">PAGE 1 LOCK</text>
        <path d="M215 36 L190 55" stroke="#34D399" stroke-width="1.2" stroke-dasharray="3 3" />

        <!-- Node 3 (Bottom Left): Authority Backlinks -->
        <rect x="0" y="125" width="85" height="36" rx="7" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.3)" stroke-width="1" />
        <text x="42" y="141" text-anchor="middle" fill="#C084FC" font-family="'Inter', sans-serif" font-size="9" font-weight="800">High PR Links</text>
        <text x="42" y="153" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="7">DOMINANT DA</text>
        <path d="M75 125 L100 105" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="3 3" />

        <!-- Node 4 (Bottom Right): Content & Funnels -->
        <rect x="205" y="125" width="85" height="36" rx="7" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="1" />
        <text x="247" y="141" text-anchor="middle" fill="#FBBF24" font-family="'Inter', sans-serif" font-size="9" font-weight="800">Landing Pages</text>
        <text x="247" y="153" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="7">MAX LEADS</text>
        <path d="M215 125 L190 105" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="3 3" />
      </g>

      <!-- Competitor Lockout Badge -->
      <g transform="translate(20, 225)">
        <rect x="0" y="0" width="290" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
        <circle cx="16" cy="18" r="4" fill="#F59E0B" />
        <text x="28" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Competitor Monitoring &amp; Lockout Strategy</text>
      </g>

      <!-- Status Bar -->
      <g transform="translate(20, 268)">
        <rect x="0" y="0" width="290" height="28" rx="6" fill="rgba(245,158,11,0.15)" />
        <text x="145" y="18" text-anchor="middle" fill="#FEF3C7" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">DEDICATED SENIOR STRATEGIST SUPPORT</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: 360 RADAR SCANNER & MARKET SHARE -->
    <g transform="translate(445, 115)">
      <rect x="0" y="0" width="260" height="310" rx="14" fill="#0E101D" stroke="rgba(245,158,11,0.25)" stroke-width="1.2" />

      <!-- Radar Screen -->
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="224" height="215" rx="12" fill="#090B14" stroke="rgba(255,255,255,0.06)" />

        <!-- Outer Radar Circles -->
        <circle cx="112" cy="100" r="82" fill="none" stroke="rgba(245,158,11,0.15)" stroke-width="1" />
        <circle cx="112" cy="100" r="56" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="1.2" stroke-dasharray="4 4" />
        <circle cx="112" cy="100" r="30" fill="none" stroke="rgba(245,158,11,0.4)" stroke-width="1.5" />

        <!-- Radar Sweep Cone -->
        <path d="M112 100 L170 42 A82 82 0 0 1 194 100 Z" fill="rgba(245,158,11,0.18)" />

        <!-- Center Shield -->
        <circle cx="112" cy="100" r="14" fill="url(#goldShield)" filter="url(#glowGold3)" />
        <!-- Crown Icon -->
        <path d="M106 102 L105 97 L108 99 L112 95 L116 99 L119 97 L118 102 Z" fill="#FFFFFF" />

        <!-- Captured Market Area Arc -->
        <path d="M112 100 L112 18 A82 82 0 1 1 34 126 Z" fill="rgba(245,158,11,0.08)" />

        <!-- Label Overlay -->
        <rect x="18" y="174" width="188" height="28" rx="7" fill="rgba(18,20,34,0.9)" stroke="rgba(245,158,11,0.4)" stroke-width="1" />
        <text x="112" y="192" text-anchor="middle" fill="#FDE047" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">78% LOCAL MARKET CAPTURED</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(18, 248)">
        <rect x="0" y="0" width="224" height="42" rx="10" fill="url(#goldBtn)" />
        <text x="112" y="26" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800">Become Market Leader</text>
      </g>
    </g>
  </g>

  <!-- FLOATING MARKET LEADER CREST BADGE -->
  <g transform="translate(48, 385)" filter="url(#shadowMkt3)">
    <rect x="0" y="0" width="195" height="46" rx="23" fill="#161828" stroke="#FBBF24" stroke-width="1.4" />
    <circle cx="24" cy="23" r="14" fill="rgba(245,158,11,0.25)" />
    <!-- Shield/Star Icon -->
    <path d="M24 14 L31 17 L31 23 C31 27, 24 31, 24 31 C24 31, 17 27, 17 23 L17 17 Z" fill="#F59E0B" filter="url(#glowGold3)" />
    <circle cx="24" cy="22" r="2.5" fill="#FFFFFF" />
    <text x="46" y="21" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800">Market Leader #1</text>
    <text x="46" y="34" fill="#FDE047" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">UNMATCHED AUTHORITY</text>
  </g>
</svg>
